<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile Card</title>
<style>
  :root{
    --bg1:#4f46e5;
    --bg2:#7c3aed;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#4f46e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrapper{
    display:flex;
    gap:32px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
  }
  .form-box{
    background:var(--card);
    border-radius:16px;
    padding:28px 26px;
    width:300px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
  }
  .form-box h2{
    margin:0 0 18px;
    font-size:20px;
    color:var(--text);
  }
  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #e5e7eb;
    border-radius:8px;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{
    border-color:var(--accent);
  }
  #errorMsg{
    color:#dc2626;
    font-size:12px;
    margin:-8px 0 12px;
    min-height:14px;
  }
  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .2s, transform .1s;
  }
  button:hover{opacity:.92;}
  button:active{transform:scale(0.98);}

  .card-box{
    width:300px;
    perspective:1000px;
  }
  .profile-card{
    background:var(--card);
    border-radius:16px;
    padding:0;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    display:none;
    animation:fadeIn .4s ease;
  }
  .profile-card.show{ display:block; }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card-header{
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    padding:30px 24px 50px;
    text-align:center;
    position:relative;
  }
  .avatar{
    width:76px;
    height:76px;
    border-radius:50%;
    background:#fff;
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
    margin:0 auto;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
    position:absolute;
    left:50%;
    bottom:-38px;
    transform:translateX(-50%);
    border:4px solid #fff;
  }
  .card-body{
    padding:50px 24px 26px;
    text-align:center;
  }
  .card-body h3{
    margin:0 0 4px;
    font-size:21px;
    color:var(--text);
  }
  .card-body .roll{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
  }
  .stats{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
  }
  .stat{
    flex:1;
    background:#f3f4f6;
    border-radius:10px;
    padding:12px 8px;
  }
  .stat .value{
    font-size:18px;
    font-weight:700;
    color:var(--text);
  }
  .stat .label{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .grade-badge{
    display:inline-block;
    padding:8px 22px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    color:#fff;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<div class="wrapper">

  <div class="form-box">
    <h2>Enter Student Details</h2>

    <div class="field">
      <label for="nameInput">Student Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Aditi Sharma">
    </div>

    <div class="field">
      <label for="rollInput">Roll No</label>
      <input type="text" id="rollInput" placeholder="e.g. 21">
    </div>

    <div class="field">
      <label for="marksInput">Marks (out of 100)</label>
      <input type="number" id="marksInput" placeholder="e.g. 87" min="0" max="100">
    </div>

    <div id="errorMsg"></div>

    <button onclick="displayProfile()">Display Profile</button>
  </div>

  <div class="card-box">
    <div class="profile-card" id="profileCard">
      <div class="card-header">
        <div class="avatar" id="avatarInitial">S</div>
      </div>
      <div class="card-body">
        <h3 id="outName">Student Name</h3>
        <div class="roll" id="outRoll">Roll No: --</div>

        <div class="stats">
          <div class="stat">
            <div class="value" id="outMarks">--</div>
            <div class="label">Marks</div>
          </div>
          <div class="stat">
            <div class="value" id="outPercent">--</div>
            <div class="label">Percent</div>
          </div>
        </div>

        <span class="grade-badge" id="gradeBadge">--</span>
      </div>
    </div>
  </div>

</div>

<script>
function getGrade(marks){
  // returns {grade, color}
  if(marks >= 90) return {grade:"A+", color:"#16a34a"};
  if(marks >= 80) return {grade:"A",  color:"#22c55e"};
  if(marks >= 70) return {grade:"B",  color:"#3b82f6"};
  if(marks >= 60) return {grade:"C",  color:"#eab308"};
  if(marks >= 50) return {grade:"D",  color:"#f97316"};
  return {grade:"F", color:"#dc2626"};
}

function displayProfile(){
  const name = document.getElementById('nameInput').value.trim();
  const roll = document.getElementById('rollInput').value.trim();
  const marksRaw = document.getElementById('marksInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.textContent = "";

  if(!name || !roll || marksRaw === ""){
    errorMsg.textContent = "Please fill in all fields.";
    return;
  }

  const marks = Number(marksRaw);

  if(isNaN(marks) || marks < 0 || marks > 100){
    errorMsg.textContent = "Marks must be a number between 0 and 100.";
    return;
  }

  const { grade, color } = getGrade(marks);

  document.getElementById('outName').textContent = name;
  document.getElementById('outRoll').textContent = "Roll No: " + roll;
  document.getElementById('outMarks').textContent = marks;
  document.getElementById('outPercent').textContent = marks + "%";
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();

  const badge = document.getElementById('gradeBadge');
  badge.textContent = "Grade: " + grade;
  badge.style.background = color;

  const card = document.getElementById('profileCard');
  card.classList.remove('show');
  void card.offsetWidth; // restart animation
  card.classList.add('show');
}
</script>

</body>
</html>
