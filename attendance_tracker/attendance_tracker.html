<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Tracker</title>
<style>
 * { box-sizing: border-box; }
 body {
 margin: 0;
 min-height: 100vh;
 padding: 40px 16px;
 font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
 background: #eeeeee;
 color: #222;
 }
 .wrap {
 max-width: 760px;
 margin: 0 auto;
 background: #ffffff;
 border-radius: 18px;
 padding: 32px 24px 24px;
 }
 h1 {
 text-align: center;
 font-size: 2.6rem;
 font-weight: 800;
 margin: 8px 0 24px;
 }
 .add-row {
 display: flex;
 gap: 10px;
 margin-bottom: 20px;
 }
 .add-row input {
 flex: 1;
 padding: 12px 14px;
 border-radius: 10px;
 border: 1px solid #ddd;
 font-size: 1rem;
 }
 .add-row button {
 padding: 12px 20px;
 border: none;
 border-radius: 10px;
 background: #2b2b2b;
 color: #fff;
 font-weight: 600;
 cursor: pointer;
 }
 .stats {
 background: #eeeeee;
 border-radius: 12px;
 display: flex;
 flex-wrap: wrap;
 justify-content: center;
 padding: 18px;
 margin-bottom: 20px;
 color: #555;
 font-size: 1.05rem;
 }
 .stats span { margin: 0 18px; }
 .row {
 background: #f5f5f5;
 border-radius: 12px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: 18px 24px;
 margin-bottom: 14px;
 }
 .row .name {
 font-weight: 700;
 font-size: 1.15rem;
 color: #333;
 width: 25%;
 }
 .row .status {
 color: #666;
 font-size: 1.05rem;
 width: 40%;
 text-align: center;
 }
 .row button {
 padding: 10px 16px;
 border: none;
 border-radius: 8px;
 background: #2b2b2b;
 color: #fff;
 font-size: 0.9rem;
 font-weight: 600;
 cursor: pointer;
 }
 .row button:hover { background: #444; }
</style>
</head>
<body>
<div class="wrap">
 <h1>Attendance Tracker</h1>
 <div class="add-row">
 <input type="text" id="nameInput" placeholder="Enter student name">
 <button id="addBtn">Add Student</button>
 </div>
 <div class="stats" id="stats"></div>
 <div id="list"></div>
</div>
<script>
 let students = [
 { name: "Joe", present: true },
 { name: "Jaan", present: true },
 { name: "Nethra", present: true },
 { name: "Kavya", present: false },
 { name: "Sanjana", present: false }
 ];
 function render() {
 const total = students.length;
 const presentCount = students.filter(s => s.present).length;
 const absentCount = total - presentCount;
 const pct = total === 0 ? "0.00" : ((presentCount / total) * 100).toFixed(2);
 document.getElementById('stats').innerHTML =
 `<span>Total: ${total}</span>
 <span>Present: ${presentCount}</span>
 <span>Absent: ${absentCount}</span>
 <span>Attendance: ${pct}%</span>`;
 const listEl = document.getElementById('list');
 listEl.innerHTML = '';
 students.forEach((s, i) => {
 const row = document.createElement('div');
 row.className = 'row';
 row.innerHTML =
 `<span class="name">${s.name}</span>
 <span class="status">Status: ${s.present ? 'Present' : 'Absent'}</span>
 <button data-index="${i}">${s.present ? 'Mark Absent' : 'Mark Present'}</button>`;
 listEl.appendChild(row);
 });
 listEl.querySelectorAll('button').forEach(btn => {
 btn.addEventListener('click', () => {
 const idx = Number(btn.getAttribute('data-index'));
 students[idx].present = !students[idx].present;
 render();
 });
 });
 }
 document.getElementById('addBtn').addEventListener('click', () => {
 const input = document.getElementById('nameInput');
 const name = input.value.trim();
 if (name !== '') {
 students.push({ name: name, present: false });
 input.value = '';
 render();
 }
 });
 render();
</script>
</body>
</html>
